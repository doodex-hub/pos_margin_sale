# Ad-hoc stack for visual UI comparison of Odoo 20.0 vs the already-running 19.0
# stack (pos_margin_sale_migration_19, docker-compose.yml, port 8079). Runs Odoo
# 20.0 FROM SOURCE (no official odoo:20.0 image on Docker Hub yet, confirmed
# 2026-09-22) using local checkouts bind-mounted read-only at runtime:
#   - D:\Kuncoro\doodex\repo\odoo20        (Community, branch 20.0) -> /odoo20
#   - D:\Kuncoro\doodex\repo\enterprise20  (Enterprise, branch 20.0) -> /enterprise20
# Deliberately separate project name / port / volumes / network from the 19.0
# stack so both can run side by side without interference.
name: pos_margin_sale_migration_20

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data-20:/var/lib/postgresql/data

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.20
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8078:8069"
      # MF-46 follow-up (2026-09-23): second port so a dedicated odoo-bin process
      # bound to a separate, uncorrupted database can be reached from the host
      # for isolated (non-parallel) Step 10 browser reruns, without touching the
      # main port-8078 process/database. Started manually via `docker compose
      # exec` when needed, not part of this service's own `command:`.
      - "8182:8182"
    volumes:
      - D:/Kuncoro/doodex/repo/odoo20:/odoo20:ro
      - D:/Kuncoro/doodex/repo/enterprise20:/enterprise20:ro
      - ../:/mnt/extra-addons
      - ./logs20:/var/log/odoo
    # Mode G2 (server stays up, interactive visual comparison) -- --http-interface
    # bound explicitly to 0.0.0.0: Odoo 20.0 containers default-bind 127.0.0.1
    # which is unreachable from the host without this flag (see
    # migration-tool/knowledge/version-diffs/19-to-20.md).
    # NOTE: HOST/USER/PASSWORD env vars above are only auto-translated to --db_host
    # etc by the OFFICIAL odoo:* image's entrypoint.sh -- since we invoke odoo-bin
    # directly (no such entrypoint here, source is bind-mounted), pass them as
    # explicit CLI flags instead, otherwise odoo-bin falls back to a local unix
    # socket and fails to reach the `db` container.
    command: >
      python3 /odoo20/odoo-bin
      -d pos_margin_sale_migration_20_qa
      --db_host=db --db_user=odoo --db_password=odoo
      -i pos_margin_threshold,sale_margin_threshold,pin_message
      --addons-path=/odoo20/addons,/enterprise20,/mnt/extra-addons
      --logfile=/var/log/odoo/odoo.log
      --http-interface=0.0.0.0

volumes:
  db-data-20:
