# Instantiated from migration-tool/templates/docker-compose.yml.template
# Adaptasi multi-modul: SATU instance untuk 3 addon (pos_margin_threshold, sale_margin_threshold,
# pin_message) — mount seluruh repo (bukan satu folder addon) supaya addons-path menemukan
# ketiganya sekaligus; Odoo mengabaikan sub-folder tanpa __manifest__.py (docker-env/, doc-dev/).
# Target migrasi 19.0 (beda dari docker-env/ project 17.0->18.0 sebelumnya di branch
# migration/18.0) — project name/db name diberi suffix _19 supaya tidak bentrok volume
# dengan instance 18.0 kalau keduanya pernah dijalankan di mesin yang sama.
name: pos_margin_sale_migration_19

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    shm_size: '2gb'  # Chrome sering crash di /dev/shm default Docker yang cuma 64MB
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8079:8069"
    volumes:
      # PENTING (2026-09-22): TIDAK LAGI mount `../` langsung -- itu working tree branch
      # migration/20.0 yang SAMA dipakai docker-compose.20.yml, dan sudah diedit untuk 20.0
      # (versi manifest 20.0.1.0 dkk). Kalau tetap di-mount di sini, stack 19.0 ini salah baca
      # kode 20.0 dan modul jadi "incompatible version" (insiden nyata, container ini sempat
      # restart dan langsung rusak karenanya). Mount clone TERPISAH dari branch migration/19.0
      # (read-only sejak baca kode aslinya, dibuat via `git clone --branch migration/19.0`,
      # lihat CLAUDE.md/PROMPT_LOG.md) supaya stack 19.0 dan 20.0 genuinely independen.
      - D:\Kuncoro\doodex\repo\pos-margin-sale-19.0-snapshot:/mnt/extra-addons:ro
      - ./logs:/var/log/odoo
      # Enterprise 19.0 (untuk verifikasi MF-34/Rental exemption sale_margin_threshold) --
      # ditambahkan 2026-09-22, read-only, dev konfirmasi path ini (BEDA dari enterprise19.0
      # yang ternyata kosong di disk).
      - D:\Kuncoro\doodex\repo\enterprise19:/mnt/enterprise19:ro
    # Mode D (Tour test headless Chrome asli, Step 6/9) -- aktif sekarang.
    # Mode G1 (install test polos) dan Mode G2 (server tetap hidup) di bawah,
    # tinggal uncomment salah satu kalau perlu ganti mode lagi.
    # NOTE: JANGAN pasang `--load-language=fr_FR` di sini. Sempat dipakai sementara untuk
    # verifikasi MF-21 (sale_margin_threshold dulu butuh bahasa Prancis terinstall) -- MF-21
    # sudah di-RESOLVE lewat fix kode (2026-08-26, sale_order.py tidak lagi bergantung pada
    # fr_FR sama sekali), jadi flag ini TIDAK PERNAH perlu dipasang lagi. Riwayat: memasangnya
    # permanen dulu sempat bikin SELURUH UI POS (dialog, format angka "1,00" vs "1.00") ikut
    # ter-render Prancis, merusak assertion Tour test modul lain yang tidak terkait sama sekali.
    # G1 (install test polos) -- sudah PASS 2026-08-27, disimpan sebagai referensi di bawah.
    # command: >
    #   odoo -d pos_margin_sale_migration_19_test
    #   -i pos_margin_threshold,sale_margin_threshold,pin_message
    #   --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    #   --stop-after-init
    #   --logfile=/var/log/odoo/odoo.log
    # Mode D (Tour test headless Chrome asli, Step 6/9) -- sudah PASS 2026-08-27, disimpan sebagai referensi.
    # command: >
    #   odoo -d pos_margin_sale_migration_19_test
    #   -i pos_margin_threshold,sale_margin_threshold,pin_message
    #   --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    #   --test-enable
    #   --test-tags=/pos_margin_threshold,/sale_margin_threshold,/pin_message
    #   --stop-after-init
    #   --logfile=/var/log/odoo/odoo.log
    # Mode G2 (server tetap hidup, Step 10 QA interaktif) -- aktif sekarang. DB "_qa" terpisah dari
    # "_test" supaya tidak bentrok/tercampur data test otomatis. Dihapus bersih setelah sesi QA.
    command: >
      odoo -d pos_margin_sale_migration_19_qa
      -i pos_margin_threshold,sale_margin_threshold,pin_message
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/enterprise19,/mnt/extra-addons
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
