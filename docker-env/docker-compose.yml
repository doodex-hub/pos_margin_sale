# Instantiated from migration-tool/templates/docker-compose.yml.template
# Adaptasi multi-modul: SATU instance untuk 3 addon (pos_margin_threshold, sale_margin_threshold,
# pin_message) — mount seluruh repo (bukan satu folder addon) supaya addons-path menemukan
# ketiganya sekaligus; Odoo mengabaikan sub-folder tanpa __manifest__.py (docker-env/, doc-dev/).
# Target migrasi 18.0 (beda dari docker-env/ backfill yang masih 17.0, lihat CLAUDE.md di
# branch backfill/17.0) — project name/db name diberi suffix _18 supaya tidak bentrok volume
# dengan instance backfill kalau keduanya pernah dijalankan di mesin yang sama.
name: pos_margin_sale_migration_18

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    shm_size: '2gb'  # Chrome sering crash di /dev/shm default Docker yang cuma 64MB
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8078:8069"
    volumes:
      - ../:/mnt/extra-addons
      - ./logs:/var/log/odoo
    # Mode D (Tour test headless Chrome asli, Step 6/9) -- aktif sekarang.
    # Mode G1 (install test polos) dan Mode G2 (server tetap hidup) di bawah,
    # tinggal uncomment salah satu kalau perlu ganti mode lagi.
    # NOTE: JANGAN pasang `--load-language=fr_FR` di sini. Sempat dipakai sementara untuk
    # verifikasi MF-21 (sale_margin_threshold dulu butuh bahasa Prancis terinstall) -- MF-21
    # sudah di-RESOLVE lewat fix kode (2026-08-26, sale_order.py tidak lagi bergantung pada
    # fr_FR sama sekali), jadi flag ini TIDAK PERNAH perlu dipasang lagi. Riwayat: memasangnya
    # permanen dulu sempat bikin SELURUH UI POS (dialog, format angka "1,00" vs "1.00") ikut
    # ter-render Prancis, merusak assertion Tour test modul lain yang tidak terkait sama sekali.
    command: >
      odoo -d pos_margin_sale_migration_18_test
      -i pos_margin_threshold,sale_margin_threshold,pin_message
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/pos_margin_threshold,/sale_margin_threshold,/pin_message
      --stop-after-init
      --logfile=/var/log/odoo/odoo.log
    # command: >
    #   odoo -d pos_margin_sale_migration_18_test
    #   -i pos_margin_threshold,sale_margin_threshold,pin_message
    #   --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    #   --stop-after-init
    #   --logfile=/var/log/odoo/odoo.log
    # command: >
    #   odoo -d pos_margin_sale_migration_18_test
    #   -u pos_margin_threshold,sale_margin_threshold,pin_message
    #   --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    #   --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
